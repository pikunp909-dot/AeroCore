name: Build AeroCore SDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK 25.2.9519653
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;25.2.9519653"
        ls $ANDROID_HOME/ndk/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build AeroCore AAR
      run: ./gradlew :aerocore:assembleRelease --stacktrace 2>&1 | tee build.log

    - name: Upload AAR
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aerocore-release
        path: aerocore/build/outputs/aar/*.aar
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
