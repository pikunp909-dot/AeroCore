name: Build AeroCore SDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 11076708
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;25.2.9519653'

    - name: Verify Android SDK
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
        ls $ANDROID_HOME/
        echo "---NDK---"
        ls $ANDROID_HOME/ndk/
        echo "---Build Tools---"
        ls $ANDROID_HOME/build-tools/

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build AeroCore Merged AAR
      run: ./gradlew :aerocore:mergeBcoreIntoAar --stacktrace 2>&1 | tee build.log

    - name: Upload Merged AAR
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: aerocore-release-merged
        path: aerocore/build/outputs/aar/aerocore-release-merged.aar
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build.log
        retention-days: 7
